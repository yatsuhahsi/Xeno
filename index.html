<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XENO | 私的対戦版</title><link rel="stylesheet" href="style.css?v=1.7"></head><body><header><h1>XENO <small>PRIVATE TABLE</small></h1><span id="connection">接続中…</span><button id="settings">⚙ 設定</button></header><main><section id="home" class="panel"><h2>テーブルに参加</h2><label>プレイヤー名<input id="name" maxlength="20" placeholder="名前"></label><div id="ruleInputs"><label>貴族<select id="noble"><option value="0">原作：対決</option><option value="1">新：対面 → 対決</option></select></label><label>少年<select id="revolution"><option value="0">原作：公開処刑</option><option value="1">革命：皇帝処刑で勝利</option></select></label><label>制限時間<select id="seconds"><option value="0">無制限</option><option>30</option><option>60</option><option>120</option></select></label></div><button id="create">ルーム作成</button><hr><label>ルームコード<input id="code" inputmode="numeric" maxlength="4" placeholder="0000"></label><button id="join">参加 / 復帰</button><p id="homeStatus" role="status"></p><small>非公式・仲間内用。ホストはゲーム情報を管理します。</small></section><section id="room" hidden><div class="toolbar"><strong id="roomCode"></strong><button id="copy">コピー</button><span id="rulesText"></span><button id="exit">退出</button></div><div id="lobby" class="panel" hidden><h2>参加者</h2><div id="members"></div><div id="hostLobby"></div></div><div id="game" hidden><div id="status" role="status"></div><div id="table"><div id="center"><div id="deck"><img src="assets/cards/back.svg" alt="山札"><b id="remaining"></b></div><div id="reserve"><img src="assets/cards/back.svg" alt="転生札"><small>転生札</small></div></div><div id="seats"></div><div id="effectLayer"></div></div><section id="controls" class="panel"></section><section class="panel chat"><div id="phrases"></div><form id="chatForm"><input id="chatText" maxlength="100" placeholder="自由に発言…"><button>送信</button></form></section><details id="history"><summary>行動履歴</summary><ol id="log"></ol></details></div></section></main><section id="choicePopup" class="choice-popup" role="dialog" aria-modal="false" aria-labelledby="choiceTitle" hidden></section><dialog id="dialog"><div id="dialogBody"></div><button id="closeDialog">閉じる</button></dialog><div id="toast" role="status"></div><script type="module" src="game.js?v=1.7"></script></body></html>
